services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopdemo-api
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: shopdemo
      DB_USERNAME: shopdemo
      DB_PASSWORD: secret
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
    depends_on:
      - mysql
      - redis
    networks:
      - shopdemo

  mysql:
    image: mysql:8.0
    container_name: shopdemo-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: shopdemo
      MYSQL_USER: shopdemo
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3308:3306"
    volumes:
      - shopdemo-mysql:/var/lib/mysql
    networks:
      - shopdemo

  redis:
    image: redis:7-alpine
    container_name: shopdemo-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    networks:
      - shopdemo

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopdemo-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=1 --tries=3 --max-time=3600
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: shopdemo
      DB_USERNAME: shopdemo
      DB_PASSWORD: secret
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    depends_on:
      - app
      - mysql
      - redis
    networks:
      - shopdemo

networks:
  shopdemo:
    driver: bridge

volumes:
  shopdemo-mysql:
